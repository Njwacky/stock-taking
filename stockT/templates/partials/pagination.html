{% if paginator.num_pages > 1 %}
<nav class="pagination">
    {% if page_obj.has_previous %}
    <a href="#" class="page-link" data-page="{{ page_obj.previous_page_number }}">&laquo; Previous</a>
    {% endif %}
    <span class="page-current">Page {{ page_obj.number }} of {{ paginator.num_pages }}</span>
    {% if page_obj.has_next %}
    <a href="#" class="page-link" data-page="{{ page_obj.next_page_number }}">Next &raquo;</a>
    {% endif %}
</nav>
<script>
    document.querySelectorAll('.page-link').forEach(link => {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            if (typeof loadPage === 'function') {
                loadPage(this.dataset.page);
            } else {
                const url = new URL(window.location.href);
                url.searchParams.set('page', this.dataset.page);
                window.location.href = url.toString();
            }
        });
    });
</script>
{% endif %}
