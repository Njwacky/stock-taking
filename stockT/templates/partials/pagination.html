{% if paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Stock item pages">
    {% if page_obj.has_previous %}
    <a href="?{% if request.GET %}{{ request.GET.urlencode }}&amp;{% endif %}page={{ page_obj.previous_page_number }}" class="page-link" data-page="{{ page_obj.previous_page_number }}" aria-label="Previous page">&laquo; Previous</a>
    {% endif %}
    <span class="page-current" aria-current="page">Page {{ page_obj.number }} of {{ paginator.num_pages }}</span>
    {% if page_obj.has_next %}
    <a href="?{% if request.GET %}{{ request.GET.urlencode }}&amp;{% endif %}page={{ page_obj.next_page_number }}" class="page-link" data-page="{{ page_obj.next_page_number }}" aria-label="Next page">Next &raquo;</a>
    {% endif %}
</nav>
{% endif %}
