{% extends 'base.html' %}

{% block title %}Delete Contact · Stock Tracker{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-card">
        <h1>Delete Contact</h1>
        <p>Are you sure you want to delete <strong>{{ contact.label }}</strong> ({{ contact.value }})?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Delete</button>
            <a href="{% url 'manage_footer_contacts' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
