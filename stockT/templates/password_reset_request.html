{% extends 'base.html' %}

{% block title %}Reset Request - Stock Management System{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1><i class="fas fa-key"></i> Request Password Reset</h1>
        <p class="auth-lead">Enter your username and clock number. An administrator will process your request.</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" class="form-control" required autofocus>
            </div>
            <div class="form-group">
                <label for="id_clock_number">Clock Number</label>
                <input type="text" name="clock_number" id="id_clock_number" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-paper-plane"></i> Submit Request</button>
        </form>
        <div class="login-links"><a href="{% url 'login' %}"><i class="fas fa-arrow-left"></i> Back to login</a></div>
    </div>
</div>
{% endblock %}
