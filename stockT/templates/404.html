{% extends 'base.html' %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="error-page">
    <span class="error-page__icon"><i class="fas fa-compass" aria-hidden="true"></i></span>
    <h1>404</h1>
    <p>We couldn't find the page you were looking for. It may have moved, or the link may be incorrect.</p>
    <div class="error-page__actions">
        <a href="{% url 'dashboard' %}" class="btn btn-primary"><i class="fas fa-house" aria-hidden="true"></i> Back to dashboard</a>
        <a href="javascript:history.back()" class="btn btn-secondary"><i class="fas fa-arrow-left" aria-hidden="true"></i> Go back</a>
    </div>
</div>
{% endblock %}
