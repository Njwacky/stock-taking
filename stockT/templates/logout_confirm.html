{% extends 'base.html' %}
{% load static %}

{% block title %}Logout - Stock Management System{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/logout-confirm.css' %}">
{% endblock %}

{% block content %}
<div class="logout-container">
    <div class="logout-card">
        <h1><i class="fas fa-right-from-bracket"></i> Logout</h1>
        <p>Are you sure you want to log out of your account?</p>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, log me out</button>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
