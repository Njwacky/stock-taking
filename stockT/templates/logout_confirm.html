{% extends 'base.html' %}

{% block title %}Log out · Stock Tracker{% endblock %}

{% block content %}
<div class="logout-container">
    <div class="logout-card">
        <span class="eyebrow">Session</span>
        <h1>Log out of Stock Tracker?</h1>
        <p>You will need to sign in again to access your workspace, stock and reports.</p>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary">Log out</button>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary">Stay signed in</a>
        </form>
    </div>
</div>
{% endblock %}
