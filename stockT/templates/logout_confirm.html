{% extends 'base.html' %}

{% block title %}Logout - Stock Management System{% endblock %}

{% block content %}
<div class="page-shell page-shell--narrow">
    <header class="page-header">
        <div class="page-header__text">
            <h1><i class="fas fa-right-from-bracket" aria-hidden="true"></i> Log out</h1>
            <p>You will need to sign in again to continue managing stock.</p>
        </div>
    </header>

    <div class="form-card">
        <div class="form-note">
            <i class="fas fa-circle-info" aria-hidden="true"></i>
            <span>Any unsaved changes on this page will be lost when you log out.</span>
        </div>

        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <div class="form-actions">
                <button type="submit" class="btn btn-danger"><i class="fas fa-right-from-bracket" aria-hidden="true"></i> Yes, log me out</button>
                <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
