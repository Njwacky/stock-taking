{% extends 'base.html' %}
{% load static %}

{% block title %}Inventory Calculator - Stock Management System{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/inventory-calculator.css' %}">
<link rel="stylesheet" href="{% static 'css/calculator.css' %}">
{% endblock %}

{% block content %}
<div class="calculator-container">
    <h1><i class="fas fa-calculator"></i> Inventory Calculator</h1>

    <div class="calculator-grid">
        <div class="calculator-card">
            <h2>Tape Length</h2>
            <div class="form-group">
                <label for="tapeWidth">Tape Width (mm)</label>
                <input type="number" id="tapeWidth" class="form-control" value="18" min="1">
            </div>
            <div class="form-group">
                <label for="tapeQty">Number of Rolls</label>
                <input type="number" id="tapeQty" class="form-control" value="1" min="0">
            </div>
            <button id="calcTapeBtn" class="btn btn-primary">Calculate</button>
            <div id="tapeResult" class="calculator-result"></div>
        </div>

        <div class="calculator-card">
            <h2>General Quantity</h2>
            <div class="form-group">
                <label for="itemQty">Items per Kit</label>
                <input type="number" id="itemQty" class="form-control" value="1" min="0">
            </div>
            <div class="form-group">
                <label for="kitQty">Number of Kits</label>
                <input type="number" id="kitQty" class="form-control" value="1" min="0">
            </div>
            <button id="calcItemsBtn" class="btn btn-primary">Calculate</button>
            <div id="itemsResult" class="calculator-result"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/calculator.js' %}"></script>
<script>
    // Simple calculator fallback if calculator.js targets other element ids
    (function() {
        function calcTape() {
            const width = parseFloat(document.getElementById('tapeWidth').value) || 0;
            const qty = parseFloat(document.getElementById('tapeQty').value) || 0;
            const totalLength = qty * 33;
            const totalArea = totalLength * (width / 1000);
            document.getElementById('tapeResult').innerHTML =
                `<p><strong>${totalLength.toFixed(2)} m</strong> total length</p>` +
                `<p><strong>${totalArea.toFixed(4)} m²</strong> total area</p>`;
        }
        function calcItems() {
            const items = parseFloat(document.getElementById('itemQty').value) || 0;
            const kits = parseFloat(document.getElementById('kitQty').value) || 0;
            document.getElementById('itemsResult').innerHTML =
                `<p><strong>${items * kits}</strong> items in total</p>`;
        }
        document.getElementById('calcTapeBtn').addEventListener('click', calcTape);
        document.getElementById('calcItemsBtn').addEventListener('click', calcItems);
    })();
</script>
{% endblock %}
