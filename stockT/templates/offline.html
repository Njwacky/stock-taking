{% extends 'base.html' %}

{% block title %}Offline - Stock Management System{% endblock %}

{% block content %}
<div class="error-page">
    <span class="error-page__icon"><i class="fas fa-wifi" aria-hidden="true"></i></span>
    <h1>You're offline</h1>
    <p>The app can't reach the server right now. Check your connection and try again — pages you've already opened may still be available.</p>
    <div class="error-page__actions">
        <a href="{% url 'dashboard' %}" class="btn btn-primary"><i class="fas fa-rotate-right" aria-hidden="true"></i> Retry</a>
    </div>
</div>
{% endblock %}
