{% extends 'base.html' %}
{% load static %}

{% block title %}Create Admin · Stock Tracker{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-card">
        <h1>Create Administrator</h1>
        <p class="text-muted">Add another administrator to help manage the workspace.</p>
        <form method="post" class="edit-user-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="id_email">Email</label>
                <input type="email" name="email" id="id_email" class="form-control">
            </div>
            <div class="form-group">
                <label for="id_clock_number">Clock Number</label>
                <input type="text" name="clock_number" id="id_clock_number" class="form-control">
            </div>
            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" class="form-control" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary"><svg class="icon" aria-hidden="true"><use href="#i-shield"></use></svg> Create Admin</button>
                <a href="{% url 'manage_admins' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
