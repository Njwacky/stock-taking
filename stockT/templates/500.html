{% extends 'base.html' %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div class="error-page">
    <span class="error-page__icon"><i class="fas fa-triangle-exclamation" aria-hidden="true"></i></span>
    <h1>500</h1>
    <p>Something went wrong on our side. Please try again in a moment — if it keeps happening, let an administrator know.</p>
    <div class="error-page__actions">
        <a href="{% url 'dashboard' %}" class="btn btn-primary"><i class="fas fa-rotate-right" aria-hidden="true"></i> Try again</a>
        <a href="javascript:history.back()" class="btn btn-secondary"><i class="fas fa-arrow-left" aria-hidden="true"></i> Go back</a>
    </div>
</div>
{% endblock %}
