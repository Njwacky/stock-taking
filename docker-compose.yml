version: '3.8'

services:
  # Django Application - Local Use Only
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock_management_web
    restart: unless-stopped
    # Match bind-mounted files to the local host user (override for Linux/macOS).
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "8001:8000"  # Host port 8001 maps to the app's container port 8000
    environment:
      - DEBUG=${DEBUG:-True}
      # Development-only fallback; settings reject it when DEBUG=False.
      - SECRET_KEY=${SECRET_KEY:-django-insecure-local-dev-key-change-in-production}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///data/db.sqlite3}
      # Add the host machine's LAN IP here when accessing from another device.
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:8001,http://127.0.0.1:8001}
      # This Compose file runs the development server over local HTTP.
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-}
      - CSRF_COOKIE_SECURE=${CSRF_COOKIE_SECURE:-}
      - SECURE_HSTS_SECONDS=${SECURE_HSTS_SECONDS:-}
      - SECURE_HSTS_INCLUDE_SUBDOMAINS=${SECURE_HSTS_INCLUDE_SUBDOMAINS:-}
      - SECURE_HSTS_PRELOAD=${SECURE_HSTS_PRELOAD:-}
      - USE_X_FORWARDED_PROTO=${USE_X_FORWARDED_PROTO:-}
      - DJANGO_RUNSERVER=0.0.0.0:8000
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      - MEDIA_ROOT=/app/mediafiles
      - STATIC_ROOT=/app/staticfiles
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./media:/app/mediafiles
      - ./logs:/app/logs
      - ./staticfiles:/app/staticfiles
      # Mount source code for development (optional - remove in production)
      - .:/app
    networks:
      - stock_network
    # Simple health check using wget (more reliable than curl)
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Note: Production services (nginx, celery) are commented out for local-only use
  # Uncomment and configure if needed for production deployment

networks:
  stock_network:
    driver: bridge
