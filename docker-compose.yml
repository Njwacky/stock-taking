version: '3.8'

services:
  # Django Application - Local Use Only
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock_management_web
    restart: unless-stopped
    ports:
      - "8001:8000"  # Changed to 8001 to avoid conflict with existing containers
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-local-dev-key-change-in-production}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///db.sqlite3}
      - ALLOWED_HOSTS=*
      # Local network access - add your local IP if needed
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:8001,http://127.0.0.1:8001,http://0.0.0.0:8001}
      - DJANGO_RUNSERVER=0.0.0.0:8000
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      - MEDIA_ROOT=/app/mediafiles
      - STATIC_ROOT=/app/staticfiles
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./media:/app/mediafiles
      - ./logs:/app/logs
      - ./staticfiles:/app/staticfiles
      # Mount source code for development (optional - remove in production)
      - .:/app
    networks:
      - stock_network
    # Simple health check using wget (more reliable than curl)
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Note: Production services (nginx, celery) are commented out for local-only use
  # Uncomment and configure if needed for production deployment

networks:
  stock_network:
    driver: bridge
